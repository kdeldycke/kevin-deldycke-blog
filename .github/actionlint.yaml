# actionlint validates `runs-on:` against a list of GitHub-hosted runner labels baked
# into the binary at build time, and the pinned 1.7.12 predates `ubuntu-26.04`. Without
# this file the Lint job fails four times over on an image GitHub has been serving for
# months, which is what moving off `ubuntu-24.04` costs today.
#
# `self-hosted-runner.labels` is actionlint's documented escape hatch for a label it does
# not recognize. It carries no implication that the runner is self-hosted.
# https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# Temporary, and deletable on a known signal rather than on a guess: repomatic ships the
# same declaration as a bundled default in the release after 7.11.0. A native config like
# this one REPLACES that bundle rather than layering over it, so leaving the file here
# after adopting that release would opt this repo out of every label added upstream
# later. Delete it when the `uses:` pins move past 7.11.0.
self-hosted-runner:
  labels:
    - ubuntu-26.04
