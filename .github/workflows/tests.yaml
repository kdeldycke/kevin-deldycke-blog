---
name: 🔬 Tests
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tests.yaml
      - content/**
      - pelicanconf.py
      - pyproject.toml
      - test_redirects.py
      - uv.lock
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs: see
      # https://github.com/actions/runner/issues/1591. Kept here as
      # documentation of intent, since the skip only becomes real through a
      # `github.head_ref` check on a job's `if:`, propagated through `needs:`.
      # Named no more precisely than that because `repomatic init
      # workflows/tests.yaml` copies this header into downstream repos, which
      # own their jobs and carry no `metadata` job for it to point at.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    paths:
      - .github/workflows/tests.yaml
      - content/**
      - pelicanconf.py
      - pyproject.toml
      - test_redirects.py
      - uv.lock
  schedule:
    # Run tests monthly to catch regressions from dependency or environment changes.
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal that tests/test_workflows.py holds
# equal to `[tool.repomatic] minimum-release-age`. Deliberate bypasses are
# per-package CLI flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  test-generation:
    name: Generate the static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      # Plumage's webassets pipeline shells out to npm to install its PostCSS
      # toolchain, so the theme cannot build without it.
      - name: Install npm
        run: |
          sudo apt --quiet --yes update
          sudo apt --quiet --yes install npm
      - name: Install Stork
        run: >
          cargo install stork-search --locked
      - name: Build website
        run: >
          uv --no-progress run --frozen --all-extras -- pelican
      # Checks what Pelican renders, which is the half djlint cannot reach: it
      # lints the Jinja sources over in the plumage repo, and a template that
      # lints clean can still emit broken markup once content is poured into
      # it. Reuses the build above rather than repeating it, which is what the
      # old lint-html job did for a third time.
      #
      # Version-pinned like plumage pins djlint. Feeds are named feed.rss and
      # feed.atom, so the .html glob already leaves them out and the old job's
      # feed filter has nothing left to do. The glob is quoted because
      # html-validate expands it itself, recursively.
      #
      # Not gating yet, and deliberately so: the default `recommended` preset
      # bundles the WCAG rules, so every pre-2010 post missing an image alt is
      # an error on the first run. That is a backlog, not a regression, and
      # burying a real defect under it helps nobody. Drop continue-on-error
      # once the count reaches zero and this starts failing like any other step.
      - name: Validate generated HTML
        continue-on-error: true
        run: >
          npx --yes html-validate@10.1.1 './output/**/*.html'

  unittests:
    name: Unittests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      # No path argument: pytest discovers everything under tests/, so a new test file is
      # picked up without editing this workflow. Naming one file here is how the local
      # Pelican patches went untested in CI for as long as they did.
      - name: Unittests
        run: >
          uv --no-progress run --frozen --all-extras -- pytest
