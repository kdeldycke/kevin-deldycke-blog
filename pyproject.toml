[project]
# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
name = "blog"
version = "1.0.0"
requires-python = ">= 3.12"
description = "Kevin Deldycke's personal blog"
license = { text = 'CC-BY-NC-SA-4.0' }
readme = "readme.md"
keywords = ['blog', 'personal']
classifiers = [
    # See: https://pypi.org/pypi?%3Aaction=list_classifiers
    'Development Status :: 5 - Production/Stable',
    'Environment :: Web Environment',
    'Framework :: Pelican',
    'License :: Other/Proprietary License',
    'Natural Language :: English',
    'Natural Language :: French',
    'Operating System :: OS Independent',
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Other',
    'Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary',
    'Topic :: Text Processing :: Markup :: HTML',
    'Topic :: Text Processing :: Markup :: Markdown',
    'Typing :: Typed',
]
dependencies = [
    "pelican[Markdown]>=4.10.0",
    "typogrify>=2.0.7",
    "plumage>=5.0.0",
    "pelican-seo>=1.2.2",
    "pelican-search>=1.1.0",
    # "pelican-similar-posts ~= 1.0.0",  # XXX Broken!
    "pelican-sitemap>=1.1.0",
    "pelican-neighbors>=1.2.0",
    # "gensim ~= 4.3.0",  # XXX Broken!
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.2",
    # More pytest plugins at: https://docs.pytest.org/en/latest/reference/plugin_list.html
    "pytest-github-actions-annotate-failures>=0.2.0",
    "pytest-randomly>=3.15.0",
    "requests>=2.32.3",
]
typing = ["types-requests>=2.32.0.20240622"]

[project.urls]
"Homepage" = 'https://kevin.deldycke.com'
"Repository" = 'https://github.com/kdeldycke/kevin-deldycke-blog'
"Funding" = "https://github.com/sponsors/kdeldycke"

[tool.lychee]
# Pelican's internal link markers are resolved at build time, so they only ever exist in
# the Markdown source. lychee reads that source and rewrites `]({attach}foo.jpg)` into
# `file://.../%7Battach%7Dfoo.jpg`, a path nothing on disk answers to. Left alone that is
# ~690 phantom failures across 164 posts, enough to bury a real one. Matching the encoded
# braces rather than the literal `{attach}` is deliberate: the check runs after lychee has
# already percent-encoded them.
exclude = [
    "%7B(attach|author|category|filename|index|static|tag)%7D",
]

[tool.repomatic]
# The release lane used to be listed here too: changelog, changelog.yaml, release.yaml
# and publish-pypi-action. RepoScope.PACKAGE_ONLY now keeps all four away from a
# `[tool.uv] package = false` project on its own, so naming them only restated what
# repomatic already works out, exactly as the codecov entry did before it went.
# debug.yaml is the one that stays: it is PYTHON_ONLY, and this repo really is a Python
# project. It just has nothing to debug, being a Pelican toolchain rather than a package.
exclude = [
    "workflows/debug.yaml",
]

# The default filter is written for a repo whose prose lives in docs/ and readme.md. Here
# the prose is the product: every post is under content/, so without it below a new article
# ships without ever having its links checked. An override rather than extra_paths because
# extra_paths only appends, and two of the defaults need removing, not supplementing:
# changelog.md and citation.cff name files this repo does not have. An override replaces
# the default outright, so what follows is the entire filter.
[tool.repomatic.workflow.paths]
"docs.yaml" = [
    ".github/workflows/docs.yaml",
    "content/**",
    "docs/**",
    "pyproject.toml",
    "readme.md",
    "uv.lock",
    "**/*.py",
]
# Same reasoning, and the same reason the default misses: source_paths derives from
# [project] name, so the stock filter watches blog/**, a directory this repo does not
# have. Both jobs below key off content/: one builds the site from it, the other reads
# the redirect map out of content/extra/.
# The root .py files are named rather than globbed. That started as a workaround for a
# repomatic bug that emitted a `**/*.py` override unquoted, which YAML reads as an alias
# and GitHub answers by dropping the workflow; v7.7.0 fixed it and a glob would be safe
# again. Keeping the names anyway, because for a repo holding two Python files at its root
# a list is more honest than a pattern: adding a third should be a deliberate edit here.
# pelican_patches.py joined the list when the local Pelican workarounds moved out of
# pelicanconf.py: it runs on every build, so a change to it has to re-run the tests.
# The suite itself is globbed, since pytest discovers it the same way.
"tests.yaml" = [
    ".github/workflows/tests.yaml",
    "content/**",
    "pelican_patches.py",
    "pelicanconf.py",
    "pyproject.toml",
    "tests/**",
    "uv.lock",
]

[tool.uv]
package = false
# The theme is my own, published by me: the 7-day cooldown in ~/.config/uv/uv.toml guards
# against a compromised upstream, which does not apply here, and it otherwise holds each
# release back for a week. Scoped to this repo rather than that global map because plumage
# is a dependency of this project alone, so a fresh clone resolves the same way without
# inheriting my machine config. A zero duration rather than a fixed date, so the next
# release is picked up without editing this file.
exclude-newer-package = { plumage = "0 days" }

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true

# Pelican ships no py.typed marker, so importing it is an error under the settings above.
# Silenced here rather than with an inline ignore on each import, because every local
# workaround in pelican_patches.py has to reach into the engine to hook onto it. Drop
# this once Pelican starts advertising its own types.
[[tool.mypy.overrides]]
module = ["pelican.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# https://docs.pytest.org/en/latest/customize.html#pyproject-toml
addopts = ["--durations=10"]
# The tests import pelicanconf and pelican_patches, which sit at the repository root.
# This project is not a package (see [tool.uv] below), so there is nothing installed for
# them to be imported from: pytest only puts the test file's own folder on sys.path, and
# from tests/ that no longer covers the root. Needed for the `pytest` console script CI
# runs, which unlike `python -m pytest` does not prepend the working directory.
pythonpath = ["."]
# Make sure tests that are expected to fail do not resurect and start working all of a sudden.
xfail_strict = true

[tool.typos]
default.extend-ignore-re = [
    # error: `ba` should be `by`, `be`
    #   --> ./content/2011/postgresql-commands.md:47:95
    #    |
    # 47 |   $ psql --tuples-only --no-align -d database_id -c "SELECT id FROM res_users;" | sed ':a;N;$!ba;s/\n/ /g'
    #    |                                                                                               ^^
    #    |
    # Issue reported at: https://github.com/crate-ci/typos/issues/642#issuecomment-2058343059
    "!ba;",
    # error: `classe` should be `class`, `classes`
    #   --> ./content/2010/convert-lotus-notes-nsf-files-mbox-nlconverter.md:120:77
    #     |
    # 120 |    pywintypes.com_error: (-2147221231, 'ClassFactory ne peut pas fournir la classe demand\xe9e', None, None)
    #     |                                                                             ^^^^^^
    #     |
    " ne peut pas fournir la classe ",
    # error: `hda` should be `had`
    #   --> content/2005/qemu-commands.md:19:29
    #    |
    # 19 |   $ qemu -cdrom /dev/cdrom -hda /home/kevin/qemu-disk-image.qcow -boot d
    #    |                             ^^^
    #    |
    # Issue reported at: https://github.com/crate-ci/typos/issues/998
    " -hda ",
    # error: `espace` should be `escape`
    #   --> ./content/2005/easy-mirroring-without-raid-the-poor-mans-disk-array.md:10:116
    #    |
    # 10 | ... in USB enclosures]({filename}/2005/creer-un-espace-de-stockage-fiable-avec-raid-5-et-lvm-sous-linux.md) ...
    #    |                                                 ^^^^^^
    #    |
    "creer-un-espace-de-stockage-fiable-avec-raid-5-et-lvm-sous-linux.md",
    # error: `cylindres` should be `cylinders`
    #   --> ./content/2005/how-to-mount-a-file-system-binary-image.md:28:31
    #    |
    # 28 | 9 têtes, 56 secteurs/piste, 0 cylindres, total 0 sectors
    #    |                               ^^^^^^^^^
    #    |
    " cylindres, ",
    # error: `THM` should be `THEM`
    #   --> ./content/2011/nichrome-preview-behind-the-scene-video.md:57:3
    #    |
    # 57 | `.THM` preview files generated by the camera for each `.MOV` clip.
    #    |   ^^^
    #    |
    ".THM",
    # error: `ND` should be `AND`
    #   --> ./content/2010/making-info-tgv-android-app-video.md:28:414
    #    |
    # 28 | ... so I attached a variable ND-filter to the lens ...
    #    |                              ^^
    #    |
    " ND-filter",
    # error: `Shure` should be `Sure`
    #   --> ./content/2010/making-info-tgv-android-app-video.md:68:154
    #    |
    # 68 | ... me his Shure Beta57A microphone ...
    #    |            ^^^^^
    #    |
    "Shure ",
    # error: `shure` should be `sure`
    #   --> ./content/2010/making-info-tgv-android-app-video.md:70:13
    #    |
    # 70 | ![]({attach}shure-beta-57a-microphone-on-gorillapod.jpg)
    #    |             ^^^^^
    #    |
    "shure-",
    # error: `hda` should be `had`
    #   --> ./content/2006/hardware-commands.md:25:28
    #    |
    # 25 | - Low-level format of the `hda` device:
    #    |                            ^^^
    #    |
    "`hda`",
    # error: `dbe` should be `be`
    #   --> ./content/2008/hp-w2207h-external-display-on-intel-945.md:37:9
    #    |
    # 37 |   Load "dbe" # Double-Buffering Extension
    #    |         ^^^
    #    |
    ' "dbe" ',
    # error: `abitrate` should be `arbitrate`
    #   --> ./content/2006/video-commands.md:297:140
    #     |
    # 297 | ... vcodec=mpeg4:vbitrate=400:v4mv:mbd=2:trell:autoaspect:dia=2:acodec=mp3:abitrate=32:vpass=1 -vf hqdn3d -o output.avi
    #     |                                                                            ^^^^^^^^
    #     |
    ":abitrate=",
] # Sections of text to ignore.
# Exclude French articles.
files.extend-exclude = [
    "content/2004/mise-en-place-paserelle-adsl-mandrake-10.md",
    "content/2005/creer-un-espace-de-stockage-fiable-avec-raid-5-et-lvm-sous-linux.md",
    "content/2005/script-de-reconnection-automatique-ppp.md",
    "content/2006/ajouter-une-entree-jack-universelle-sur-un-telephone-sagem-my700xi.md",
    "content/2009/cool-cavemen-creative-commons-moi.md",
    "content/2010/comment-supprimer-des-comptes-mails-secondaires-free-fr.md",
    "content/2012/ovh-configuration-modem-thomson-tg585-ipoe.md",
]
